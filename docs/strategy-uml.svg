<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1195" viewBox="0 0 1300 1195" role="img" aria-labelledby="title description">
<title id="title">Calculator using the Strategy pattern — UML class diagram</title>
<desc id="description">Main configures Calculator and creates four concrete strategies. Calculator has a shared aggregation to one OperationStrategy; the hollow diamond is at Calculator. Each concrete strategy realizes OperationStrategy through a dashed line ending with a hollow triangle at the interface. Main private helpers and its private strategy map are omitted. Operation parameters are shown as types only.</desc>
